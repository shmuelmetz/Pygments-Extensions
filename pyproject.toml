[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-extensions"
version = "0.1.0"
description = "A collection of community-maintained lexers extending the Pygments syntax-highlighting ecosystem."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Shmuel (Seymour J.) Metz", email = "smetz3@gmu.edu" }
]

dependencies = [
    "Pygments>=2.0"
]

keywords = [
    "pygments",
    "syntax-highlighting",
    "lexer",
    "mainframe",
    "oorexx",
    "pli",
    "rexx",
    "ispf",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/shmuelmetz/pygments-extensions"
Issues = "https://github.com/shmuelmetz/pygments-extensions/issues"

# ------------------------------------------------------------
# Entry points: this is how Pygments discovers your lexers.
# Each lexer you add will need an entry here.
#
# IMPORTANT: only list entries for modules that actually exist. Confirmed
# by direct testing: Pygments' plugin loader (find_plugin_lexers) eagerly
# imports *every* registered entry point as soon as *any* lexer is looked
# up by name (get_lexer_by_name), not just the one being requested. A
# stub entry for a module that doesn't exist yet breaks lookup for every
# other lexer in this package too, not just itself. Keep not-yet-built
# lexers commented out here (they're still real future scope -- see
# README.md "Future direction" -- just not wired up until implemented).
# ------------------------------------------------------------
[project.entry-points."pygments.lexers"]
oorexx = "pygments_extensions.lexers.oorexx:OORexxLexer"
pli = "pygments_extensions.lexers.pli:PLILexer"
netrexx = "pygments_extensions.lexers.netrexx:NetRexxLexer"

# Not implemented yet -- see README.md for current-vs-future scope.
# Uncomment each line as its module is actually written.
# ispf_panel = "pygments_extensions.lexers.ispf_panel:ISPFPanelLexer"
# ispf_message = "pygments_extensions.lexers.ispf_message:ISPFMessageLexer"
# ispf_skeleton = "pygments_extensions.lexers.ispf_skeleton:ISPFSkeletonLexer"
# ispf_dtl = "pygments_extensions.lexers.ispf_dtl:ISPFDTLLexer"
# hlasm = "pygments_extensions.lexers.hlasm:HLASMLexer"
# jcl = "pygments_extensions.lexers.jcl:JCLLexer"

# ------------------------------------------------------------
# Optional development tools
# ------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
# Flat layout: without this, setuptools' auto-discovery also picks up
# samples/ (example .rex/.pli files, not Python) as a second top-level
# "package" and refuses to build at all. Confirmed by an actual
# `pip install -e .` failure before this was added.
include = ["pygments_extensions*"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
